services:
  autoresearching-ai-dev:
    container_name: autoresearching-ai-dev
    image: autoresearching-ai-dev:latest
    user: root
    network_mode: "host"
    restart: always
    env_file:
      - .env
    environment:
      # Giới hạn số job xử lý song song mỗi listener (tối ưu server 2-4 vCPU, tiết kiệm RAM)
      LISTENER_CONCURRENCY: "${LISTENER_CONCURRENCY:-3}"
    # Chặn 1 container ăn hết RAM host (tối ưu cho VPS 4GB-8GB)
    mem_limit: "${APP_MEM_LIMIT:-2.5g}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: ["python", "main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
