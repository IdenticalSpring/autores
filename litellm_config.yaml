# ==============================================================================
# LITELLM PROXY CONFIGURATION FOR AUTORESEARCHING
# ==============================================================================
# Hướng dẫn:
# 1. Đặt GROQ_API_KEY trong file .env hoặc biến môi trường.
# 2. LiteLLM Proxy nhận request từ autoresearching với model_id "localhost"
#    và tự động chuyển tiếp tới Groq API (siêu tốc).
# ==============================================================================

model_list:
  # Alias "localhost" để map trực tiếp với model mặc định của Groq
  - model_name: localhost
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: localhost
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: "os.environ/GROQ_API_KEY"

  # Các model Groq nếu muốn gọi cụ thể
  - model_name: openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: groq/llama-3.1-8b-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: groq/mixtral-8x7b-32768
    litellm_params:
      model: groq/mixtral-8x7b-32768
      api_key: "os.environ/GROQ_API_KEY"

  # ============================================================================
  # DEEPSEEK (provider chính - thay Gemini free tier khi hết quota)
  # Alias "local-*": get_llm() route vào LiteLLM qua nhánh startswith("local")
  # nên KHÔNG cần sửa code Python, KHÔNG cần tạo AI_KEY:* trong Redis.
  # ============================================================================
  - model_name: local-deepseek
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # Bản lớn (pro) cho bước cần suy luận nặng: proposal, phương pháp luận
  - model_name: local-deepseek-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # Legacy alias (deepseek-chat/reasoner đã ngừng 2026-07-24) - giữ để tương thích
  - model_name: local-deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # Fallback rẻ/nhanh khi DeepSeek lỗi 429/402/503
  - model_name: local-fallback
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: "os.environ/GROQ_API_KEY"

general_settings:
  dangerously_permit_weak_or_unset_master_key: true

litellm_settings:
  drop_params: true
  set_verbose: false
